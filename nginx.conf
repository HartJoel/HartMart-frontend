server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Hashed build assets are safe to cache indefinitely.
    location ~* \.(?:js|css|svg|png|jpg|jpeg|gif|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # React Router uses the History API — any unmatched path falls back to
    # index.html so client-side routing can take over.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
